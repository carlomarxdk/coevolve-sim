[project]
name = "coevolve-sim"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "bitsandbytes",
    "cmcrameri>=1.9",
    "cvxpy>=1.8.1",
    "datasets>=4.0.0",
    "english-words>=2.0.2",
    "geonamescache>=3.0.1",
    "hydra-core>=1.3.2",
    "inflect>=7.5.0",
    "ipykernel",
    "matplotlib>=3.9",
    "namemaker>=1.2",
    "nltk>=3.9.4",
    "nnsight>=0.6.2",
    "numpy>=2.0",
    "omegaconf",
    "pandas>=2.0",
    "polars>=1.33.0",
    "pydantic>=2.10.0",
    "rpy2>=3.6.5",
    "scikit-learn>=1.7.0",
    "scipy",
    "seaborn>=0.13.2",
    "statsmodels",
    "torch==2.6.0",
    "torchvision",
    "tqdm>=4.67.0",
    "transformers==4.57.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pyright>=1.1.390",
    "ruff>=0.9.0",
    "types-PyYAML",
    "types-tqdm",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "archived",
    "data",
    "notebooks",
    "tests",
    "paper",
    "resources",
    "results",
    "scripts",
    "src/analysis/",
    "src/core/work-in-progress/",
    "src/core/selection_utils/",
    "src/selection/",
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings: catches things like trailing whitespace
    "I",    # isort
    "N",    # pep8 naming
    "ANN",  # annotations
    "B",    # likely bugs
    "RUF",  # ruff-specific
    "NPY",  # numpy-specific
    "ISC",  # implicit string concatenation: catches accidental joins
]

ignore = [
    "ANN401",  # disallows Any: too strict for HF model types
    "E501",    # line length: handled by ruff-format
    "N806",    # variable in function should be lowercase (we kinda abused this, and it will take too much time to fix
    "ANN204",  # missing return type
    "ANN202",  # missing return type for classmethod
    "ANN201",  # missing return type for staticmethod
    "ANN001",  # missing type annotation for function argument
    "ANN003",  # missing type annotation for self argument
    "E712",    # comparison to True/False
    "ISC001",  # implicit string concat on one line (conflicts with ruff-format)
    "G004",    # f-string in logging: common pattern
    "SIM108",  # redundant isinstance check: too noisy with HF types
    "N803",    # argument name should be lowercase (e.g. "DataLoader")
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"src/run.py"      = ["ANN"]
"tests/*"         = ["ANN", "N"]
"notebooks/*"     = ["ANN", "E402", "F401", "T201"]  # E402=module imports, F401=unused, T201=print
"**/__init__.py"  = ["F401"]  # re-exports are intentional


[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

reportReturnType = true
reportUnusedImport = true

# Too noisy with torch/HF/numpy
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateImportUsage = false
reportMissingImports = false
reportMissingModuleSource = false

# Per-module overrides for libraries without stubs
executionEnvironments = []

[tool.pyright.defineConstant]
TYPE_CHECKING = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "-ra",
]
xfail_strict = true
markers = [
    "slow: tests that are slow relative to unit tests",
    "gpu: tests requiring CUDA",
    "integration: multi-component or end-to-end tests",
]
filterwarnings = [
    # Suppress noisy third-party warnings
    "ignore::DeprecationWarning:torch.*",
    "ignore::PendingDeprecationWarning:torch.*",
    "ignore::FutureWarning:torch.*",
    "ignore::FutureWarning:transformers.*",
    "ignore::UserWarning:torch.*",
    "ignore::UserWarning:transformers.*",
    "ignore::UserWarning:huggingface.*",
    # Version mismatch warnings (known noisy)
    "ignore:.*version.*:UserWarning",
    "ignore:.*Version.*:UserWarning",
]
